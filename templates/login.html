<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>系統登入</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 450px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center"><h3>請假系統登入</h3></div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">帳號</label>
                        <input type="text" name="username" class="form-control" required placeholder="請輸入帳號">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密碼</label>
                        <input type="password" name="password" class="form-control" required placeholder="請輸入密碼">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登入</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('register') }}">還沒有帳號？點此註冊</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
