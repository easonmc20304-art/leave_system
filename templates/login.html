<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統登入</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 px-3" style="max-width: 420px;">
        <h2 class="text-center mb-4 fw-bold text-secondary">請假系統</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <div class="card p-4 shadow border-0 rounded-3">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">帳號 (Username)</label>
                    <input type="text" name="username" class="form-control" placeholder="請輸入帳號" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">密碼 (Password)</label>
                    <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">安全登入</button>
            </form>
            <div class="text-center mt-3">
                <a href="/register" class="text-decoration-none text-muted small">還沒有帳號？前往註冊 →</a>
            </div>
        </div>
    </div>
</body>
</html>
