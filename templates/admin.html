<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>管理員控制台</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h3>假單管理後台</h3>
                <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">安全登出</a>
            </div>
            <div class="card-body">
                <h5 class="card-title mb-4">目前收到的請假申請：</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>編號</th>
                                <th>申請人資訊</th>
                                <th>請假原因與時段</th>
                                <th>申請時間</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for record in records %}
                            <tr>
                                <td>{{ record[0] }}</td>
                                <td><strong>{{ record[1] }}</strong></td>
                                <td>{{ record[2] }}</td>
                                <td><small class="text-muted">{{ record[3] }}</small></td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">目前沒有任何請假紀錄。</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
