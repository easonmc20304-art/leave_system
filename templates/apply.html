<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>填寫請假單</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>你好，{{ name }} 👋</h2>
            <a href="/logout" class="btn btn-sm btn-outline-danger">登出</a>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="card p-4 shadow-sm">
            <h4 class="card-title mb-3">線上請假申請</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">請輸入您的「姓名」或「員工ID」</label>
                    <input type="text" name="user_info" class="form-control" placeholder="例如: 王小明 (ID: 1024)" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">請假事由 / 時間說明</label>
                    <textarea name="reason" class="form-control" rows="4" placeholder="請註明請假日期、假別與原因..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">提交假單</button>
            </form>
        </div>
    </div>
</body>
</html>
