<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>填寫請假單</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <span>線上請假申請系統</span>
                <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">登出 ({{ name }})</a>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">申請人與部門資訊</label>
                        <input type="text" name="user_info" class="form-control" placeholder="例如：研發部 - 王小明" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">請假事由與時間</label>
                        <textarea name="reason" class="form-control" rows="4" placeholder="請註明請假種類、日期與詳細原因" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-info text-white w-100">送出請假申請</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
